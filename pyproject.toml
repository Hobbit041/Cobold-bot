[project]
name = "botopros"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.30.0",
    "SQLAlchemy==2.0.51",
    "aiosqlite==0.22.1",
    "APScheduler==3.11.3",
    "python-dotenv==1.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
